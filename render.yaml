# ============================================================
# Render Blueprint — Static Site cho Phở Cuốn Ngon
# Cách dùng: Render Dashboard > New > Blueprint > chọn repo này.
# Hoặc tạo thủ công: New > Static Site > Build Command để trống,
# Publish Directory: . (thư mục gốc)
# ============================================================
services:
  - type: web
    name: pho-cuon-ngon
    runtime: static
    buildCommand: echo "Static site - no build step required"
    staticPublishPath: .
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
